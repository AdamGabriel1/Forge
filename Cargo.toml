[workspace]
members = [
    "crates/forge-core",
    "crates/forge-parser",
    "crates/forge-semantic",
    "crates/forge-cfg",
    "crates/forge-format",
    "crates/forge-lint",
    "crates/forge-cli",
]
resolver = "2"

[workspace.dependencies]
tree-sitter = "0.22"
tree-sitter-python = "0.21"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
owo-colors = "4.0"
rayon = "1.10"
similar = "2.5"